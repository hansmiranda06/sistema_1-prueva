services:
  mariadb:
    image: mariadb:11
    container_name: corpo_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: corpo_agregados
      MYSQL_USER: corpo
      MYSQL_PASSWORD: CorpoDB2026!
      MYSQL_ROOT_PASSWORD: ChangeRoot2026!
    volumes:
      - corpo_db:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  app:
    build: .
    container_name: mi_planta_cat
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DB_HOST: mariadb
      DB_NAME: corpo_agregados
      DB_USER: corpo
      DB_PASSWORD: CorpoDB2026!
    ports:
      - "8090:80"

volumes:
  corpo_db:
