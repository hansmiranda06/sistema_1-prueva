version: '3.8'

services:

  mariadb:
    image: mariadb:11
    container_name: planta_agregados_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-planta_agregados}
      MYSQL_USER: ${DB_USER:-planta}
      MYSQL_PASSWORD: ${DB_PASSWORD:-PlantaDB2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPlanta2026!}
    volumes:
      - planta_db:/var/lib/mysql
      # CORREGIDO: Ahora mapea el archivo directo desde la raíz, sin la carpeta /database
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - planta_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  planta_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planta_agregados_web
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-planta_agregados}
      DB_USER: ${DB_USER:-planta}
      DB_PASSWORD: ${DB_PASSWORD:-PlantaDB2026!}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - planta_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: planta_agregados_phpmyadmin
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-RootPlanta2026!}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - planta_net

networks:
  planta_net:
    driver: bridge

volumes:
  planta_db:
